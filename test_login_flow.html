<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Flow Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔐 Login Flow Test</h1>
    <p>This test simulates the login flow to verify automatic redirect works.</p>
    
    <div id="results"></div>
    
    <script>
        async function testLoginFlow() {
            const results = document.getElementById('results');
            
            function addResult(message, type = 'info') {
                const div = document.createElement('div');
                div.className = `test-result ${type}`;
                div.textContent = message;
                results.appendChild(div);
            }
            
            try {
                addResult('🔍 Starting login flow test...');
                
                // Clear any existing tokens
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                addResult('🧹 Cleared existing tokens');
                
                // Simulate login
                const loginData = {
                    username: 'admin@ricemill.com',
                    password: 'admin123',
                    method: 'password',
                    device_info: {
                        browser: 'test',
                        os: 'test',
                        ip: '127.0.0.1'
                    }
                };
                
                addResult('🔐 Attempting login...');
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    addResult('✅ Login API call successful', 'success');
                    
                    // Simulate what the frontend does
                    localStorage.setItem('token', result.access_token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    addResult('💾 Stored token and user data in localStorage', 'success');
                    
                    // Test the /me endpoint
                    addResult('🔍 Testing /me endpoint...');
                    const meResponse = await fetch('http://localhost:5000/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${result.access_token}`
                        }
                    });
                    
                    if (meResponse.ok) {
                        const userData = await meResponse.json();
                        addResult('✅ /me endpoint working - token is valid', 'success');
                        addResult(`👤 User: ${userData.user.username} (${userData.user.email})`, 'info');
                    } else {
                        addResult('❌ /me endpoint failed', 'error');
                    }
                    
                    addResult('🎯 Login flow test completed successfully!', 'success');
                    addResult('💡 The frontend should now redirect automatically after login', 'info');
                    
                } else {
                    addResult('❌ Login failed', 'error');
                }
                
            } catch (error) {
                addResult(`💥 Error: ${error.message}`, 'error');
            }
        }
        
        // Run the test when page loads
        testLoginFlow();
    </script>
</body>
</html>
