<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad1)" rx="20"/>
  
  <!-- Rice grain icon -->
  <g transform="translate(256,256)">
    <!-- Main grain -->
    <ellipse cx="0" cy="0" rx="64" ry="128" fill="white" opacity="0.9"/>
    
    <!-- Side grains -->
    <ellipse cx="-85" cy="-64" rx="42" ry="85" fill="white" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="85" cy="-64" rx="42" ry="85" fill="white" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Text for larger icons -->
    <text x="0" y="128" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="42" font-weight="bold">MILL</text>
  </g>
  
  <!-- Border -->
  <rect width="508" height="508" x="2" y="2" fill="none" stroke="#1565c0" stroke-width="2" rx="18"/>
</svg>