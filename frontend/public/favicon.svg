<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="url(#grad1)" rx="20"/>
  
  <!-- Rice grain icon -->
  <g transform="translate(32,32)">
    <!-- Main grain -->
    <ellipse cx="0" cy="0" rx="8" ry="16" fill="white" opacity="0.9"/>
    
    <!-- Side grains -->
    <ellipse cx="-10" cy="-8" rx="5" ry="10" fill="white" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="10" cy="-8" rx="5" ry="10" fill="white" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Text for larger icons -->
    
  </g>
  
  <!-- Border -->
  <rect width="60" height="60" x="2" y="2" fill="none" stroke="#1565c0" stroke-width="2" rx="18"/>
</svg>